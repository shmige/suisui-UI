# 固定使用 JDK 21 (2026-09 构建链升级: 参考 KernelSU-Style-UI-Kit 同款 Kotlin 2.4 / AGP 9)
org.gradle.java.home=C:/Program Files/Microsoft/jdk-21.0.13.21-hotspot
# 守护进程 JVM 条件要求 21 (gradle/gradle-daemon-jvm.properties)。
# Android Studio 自带的 JBR 已经是 25, Gradle 自动探测找不到 Program Files\Microsoft 下的 JDK,
# 就会去 foojay 下载 → 国内网络卡死在整个构建开始之前。这里显式指路 + 禁止联网下载。
org.gradle.java.installations.paths=C:/Program Files/Microsoft/jdk-21.0.13.21-hotspot
org.gradle.java.installations.auto-download=false
# 8GB 内存机器: 限制 Gradle/Kotlin 守护进程, 避免 Windows 提交内存耗尽
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2

org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
